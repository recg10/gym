
<div class="login">
    <form class="custom-form" method="post">      
      <div style="text-align: center;">
        <h1>Administración y Gestión</h1>
        <img src="./assets/karelia.JPG" height="100" width="100">        
      </div>
      <input
        type="email"
        [(ngModel)]="email"
        name="email"
        placeholder="Email"
        required="required"
      />
      <input
        type="password"
        [(ngModel)]="password"
        name="password"
        placeholder="Password"
        required="required"
      />
      <button style="cursor: pointer;" type="submit" (click)="login()">Ingresar</button>
      <div *ngIf="msgError!=''" class="error-text">
        <li>
            <strong>Error en credenciales</strong>
        </li>
      </div>
    </form>
  </div>
