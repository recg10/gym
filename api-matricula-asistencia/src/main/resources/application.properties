# Hibernate ddl auto property
#spring.jpa.hibernate.ddl-auto=update
spring.datasource.driver-class-name=com.mysql.jdbc.Driver

#Configura las conexiones dl datasource
#maximum pool size
spring.datasource.hikari.maximum-pool-size=5 
#spring.datasource.hikari.initial-size=1
spring.datasource.hikari.idleTimeout=120000
#spring.datasource.hikari.max-idle=1
#spring.datasource.hikari.default-query-timeout=10000
#spring.datasource.hikari.default-auto-commit=true
#spring.datasource.hikari.max-active=10
#spring.datasource.hikari.max-wait=20000
#maximum number of milliseconds that a client will wait for a connection
spring.datasource.hikari.connection-timeout=30000
#minimum number of idle connections maintained by HikariCP in a connection pool
spring.datasource.hikari.minimum-idle=5
#maximum idle time for connection - This property controls the maximum amount of time (in milliseconds) that a connection is allowed to sit idle in the pool.
spring.datasource.hikari.idle-timeout=10000
# maximum lifetime in milliseconds of a connection in the pool after it is closed.
spring.datasource.hikari.max-lifetime=1000
#default auto-commit behavior.
spring.datasource.hikari.auto-commit=true

# Hibernate Properties # The SQL dialect is used to generate the better SQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.current_session_context_class=org.springframework.orm.hibernate5.SpringSessionContext
#spring.jpa.properties.hibernate.transaction.auto_close_session=true
spring.jpa.properties.hibernate.connection.release_mode=after_statement
spring.jackson.time-zone=America/Santiago

spring.jmx.enabled= false

